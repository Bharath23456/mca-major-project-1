
name: CloudNetOps-AI GCP Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudnetops-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest

    steps:
      # Step 1: Validate GitHub repository variables
      - name: Validate deployment configuration
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          DEPLOY_USER: ${{ vars.GCP_DEPLOY_USER }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          check_variable() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "ERROR: GitHub variable $name is missing."
              exit 1
            fi
          }

          check_variable GCP_PROJECT_ID "$PROJECT_ID"
          check_variable GCP_VM_NAME "$VM_NAME"
          check_variable GCP_VM_ZONE "$VM_ZONE"
          check_variable GCP_DEPLOY_USER "$DEPLOY_USER"
          check_variable GCP_WIF_PROVIDER "$WIF_PROVIDER"
          check_variable GCP_SERVICE_ACCOUNT "$SERVICE_ACCOUNT"

          echo "All six GitHub repository variables are configured."

      # Step 2: Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud using WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Step 3: Install Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Verify Google Cloud authentication
      - name: Verify Google Cloud authentication
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(projectId)"

      # Step 5: Deploy application through IAP SSH
      - name: Deploy application through IAP SSH
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          DEPLOY_USER: ${{ vars.GCP_DEPLOY_USER }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND="sudo -n -u ${DEPLOY_USER} bash -lc 'set -euo pipefail; cd /opt/cloudnetops-ai; git fetch origin main; git reset --hard origin/main; sudo -n docker compose config --quiet; sudo -n docker compose up --build -d --wait --wait-timeout 180; curl --fail --silent --show-error http://127.0.0.1:8000/health/ready'"

          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="$REMOTE_COMMAND"

      # Step 6: Deployment result
      - name: Deployment completed
        run: |
          echo "CloudNetOps-AI deployment completed successfully."
