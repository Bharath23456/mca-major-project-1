
name: CloudNetOps-AI GCP Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudnetops-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate deployment configuration
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          DEPLOY_USER: ${{ vars.GCP_DEPLOY_USER }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          for value in \
            "$PROJECT_ID" \
            "$VM_NAME" \
            "$VM_ZONE" \
            "$DEPLOY_USER" \
            "$WIF_PROVIDER" \
            "$SERVICE_ACCOUNT"
          do
            if [[ -z "$value" ]]; then
              echo "A required GitHub Actions variable is missing."
              exit 1
            fi
          done

          gcloud config set project "$PROJECT_ID"

      - name: Deploy application through IAP SSH
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          DEPLOY_USER: ${{ vars.GCP_DEPLOY_USER }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND="sudo -n -u ${DEPLOY_USER} bash -lc 'set -euo pipefail; cd /opt/cloudnetops-ai; git fetch origin main; git reset --hard origin/main; sudo -n docker compose config --quiet; sudo -n docker compose up --build -d --wait --wait-timeout 180; curl --fail --silent --show-error http://127.0.0.1:8000/health/ready'"

          gcloud compute ssh "$VM_NAME" \
            --project="$PROJECT_ID" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="$REMOTE_COMMAND"

      - name: Deployment completed
        run: echo "CloudNetOps-AI deployment completed successfully."
