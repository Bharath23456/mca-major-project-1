name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting and common errors
        run: ruff check app tests

      - name: Audit runtime dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest -q

      - name: Validate Compose model
        run: |
          cp .env.example .env
          GRAFANA_ADMIN_PASSWORD=ci-only-config-validation-value docker compose config --quiet

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            --entrypoint=promtool \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint=amtool \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate JSON configuration
        run: |
          python -m json.tool monitoring/prometheus/blackbox_targets.json > /dev/null
          python -m json.tool monitoring/grafana/dashboards/infrastructure.json > /dev/null

      - name: Build application image
        run: docker build --tag cloudnetops-ai:${{ github.sha }} .
