route:
  receiver: cloudnetops-local-webhook
  group_by: ["alertname", "instance"]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: cloudnetops-local-webhook
    webhook_configs:
      - url: http://app:8000/api/v1/alerts/webhook
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token
        send_resolved: true
