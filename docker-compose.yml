name: cloudnetops-ai

services:
  app:
    build: .
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DATABASE_URL: sqlite:////data/cloudnetops.db
      MODEL_PATH: /data/isolation_forest.joblib
      BLACKBOX_TARGETS_PATH: /etc/cloudnetops/blackbox_targets.json
      ALERTMANAGER_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager_webhook_token
      CPU_THRESHOLD_PERCENT: ${CPU_THRESHOLD_PERCENT:-85}
      MEMORY_THRESHOLD_PERCENT: ${MEMORY_THRESHOLD_PERCENT:-90}
      DISK_THRESHOLD_PERCENT: ${DISK_THRESHOLD_PERCENT:-90}
      CAPACITY_FORECAST_WARNINGS_ENABLED: ${CAPACITY_FORECAST_WARNINGS_ENABLED:-false}
      INCIDENT_REPEAT_WARNING_COUNT: ${INCIDENT_REPEAT_WARNING_COUNT:-3}
      INCIDENT_REPEAT_CRITICAL_COUNT: ${INCIDENT_REPEAT_CRITICAL_COUNT:-5}
      INCIDENT_REPEAT_WINDOW_HOURS: ${INCIDENT_REPEAT_WINDOW_HOURS:-24}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      LOGIN_IDENTITY_LIMIT: ${LOGIN_IDENTITY_LIMIT:-5}
      LOGIN_IP_LIMIT: ${LOGIN_IP_LIMIT:-20}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-recaptcha}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    volumes:
      - app-data:/data
      - ./monitoring/prometheus/blackbox_targets.json:/etc/cloudnetops/blackbox_targets.json:ro
    secrets:
      - alertmanager_webhook_token
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - node-exporter
      - blackbox-exporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox:/etc/blackbox_exporter:ro
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    secrets:
      - alertmanager_webhook_token
    group_add:
      - "10001"
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a unique GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

secrets:
  alertmanager_webhook_token:
    file: ./secrets/alertmanager-webhook-token
